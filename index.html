<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Stop Service - ศูนย์รวมบริการอำนวยความสะดวกครบวงจร 9-in-1</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="One Stop">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'sans-serif'],
          },
          colors: {
            darkBg: '#0b0f19',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f9fafb;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.10) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-card {
      background: rgba(31, 41, 55, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .text-gradient-purple {
      background: linear-gradient(135deg, #c084fc 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 22s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .pulse-sos {
      animation: pulseGlow 1.8s infinite ease-in-out;
    }
  </style>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then((reg) => {
            console.log('[PWA] Service Worker registered successfully, scope:', reg.scope);
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          })
          .catch((err) => {
            console.warn('[PWA] service-worker.js registration failed, trying sw.js fallback:', err);
            navigator.serviceWorker.register('/sw.js', { scope: '/' });
          });
      });
    }
  </script>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Smart Home Devices State
      const [smartDevices, setSmartDevices] = useState([
        { id: 1, name: 'ไฟดาวน์ไลท์ห้องรับแขก', room: 'Living Room', on: true, icon: 'lightbulb' },
        { id: 2, name: 'เครื่องปรับอากาศ Inverter', room: 'Bedroom', on: true, icon: 'wind' },
        { id: 3, name: 'Smart TV 65 นิ้ว', room: 'Living Room', on: false, icon: 'tv' },
        { id: 4, name: 'ไฟหัวเตียงนอน', room: 'Bedroom', on: false, icon: 'lamp' },
        { id: 5, name: 'ประตูรั้วอัตโนมัติ', room: 'Garage', on: true, icon: 'door-closed' },
      ]);

      // Stock Watchlist State
      const [stocks] = useState([
        { symbol: 'SET Index', price: '1,385.42', change: '+12.30', pct: '+0.90%', up: true },
        { symbol: 'PTT', price: '34.50', change: '+0.50', pct: '+1.47%', up: true },
        { symbol: 'CPALL', price: '58.25', change: '+0.75', pct: '+1.30%', up: true },
        { symbol: 'ADVANC', price: '215.00', change: '-1.00', pct: '-0.46%', up: false },
        { symbol: 'DELTA', price: '82.50', change: '+2.00', pct: '+2.48%', up: true },
      ]);

      // News State
      const [newsList] = useState([
        { id: 1, tag: 'เศรษฐกิจ', title: 'แบงก์ชาติประเมินเศรษฐกิจไทยปี 2026 ขยายตัวต่อเนื่อง', time: '15 นาทีที่แล้ว' },
        { id: 2, tag: 'พลังงาน', title: 'การไฟฟ้าเปิดตัวระบบ e-Service และลดค่าไฟรอบบิลใหม่', time: '1 ชั่วโมงที่แล้ว' },
        { id: 3, tag: 'เทคโนโลยี', title: 'เปิดตัวเทคโนโลยี AI ผู้ช่วยอัจฉริยะภาษาไทยเต็มรูปแบบ', time: '2 ชั่วโมงที่แล้ว' }
      ]);

      // SOS Alert State
      const [sosActive, setSosActive] = useState(false);

      // Bill Payment Modal State
      const [showBillModal, setShowBillModal] = useState(false);
      const [billPaid, setBillPaid] = useState(false);

      // AI Chat Assistant Modal State
      const [showAiModal, setShowAiModal] = useState(false);
      const [aiInput, setAiInput] = useState('');
      const [aiMessages, setAiMessages] = useState([
        { sender: 'ai', text: 'สวัสดีครับ คุณนรเศรษฐ์! ผมคือผู้ช่วย AI ประจำ One Stop Service มีอะไรให้ผมช่วยเหลือวันนี้ครับ?' }
      ]);

      // Notifications State
      const [notifications] = useState([
        { id: 1, title: 'บิลค่าไฟฟ้าครบกำหนดชำระ', detail: 'ยอดชำระ 1,820.00 บาท (MEA)', time: '10 นาทีที่แล้ว' },
        { id: 2, title: 'ระบบ Smart Home เชื่อมต่อสมบูรณ์', detail: 'อุปกรณ์ 5 ชิ้นออนไลน์พร้อมสั่งการ', time: '30 นาทีที่แล้ว' }
      ]);
      const [showNotif, setShowNotif] = useState(false);

      // PWA Install State
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallModal, setShowInstallModal] = useState(false);
      const localNetworkUrl = window.location.origin;

      // Listen for PWA Install Prompt
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [smartDevices, sosActive, showBillModal, billPaid, showAiModal, aiMessages, showNotif, showInstallModal]);

      const handleInstallPWA = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted PWA installation');
            }
            setDeferredPrompt(null);
          });
        } else {
          setShowInstallModal(true);
        }
      };

      const toggleDevice = (id) => {
        setSmartDevices(prev => prev.map(d => d.id === id ? { ...d, on: !d.on } : d));
      };

      const handleSendAiMessage = () => {
        if (!aiInput.trim()) return;
        const userText = aiInput;
        setAiMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setAiInput('');

        setTimeout(() => {
          let reply = 'ผมได้รับคำถามของคุณนรเศรษฐ์แล้วครับ ยินดีให้บริการและช่วยเหลือทุกเรื่องในชีวิตประจำวันครับ!';
          if (userText.includes('ค่าไฟ') || userText.includes('บิล')) {
            reply = 'บิลค่าไฟฟ้าประจำเดือนนี้ของคุณนรเศรษฐ์ คือ 1,820.00 ฿ (การไฟฟ้านครหลวง MEA) คุณสามารถกดสแกน QR PromptPay ชำระได้ทันทีบนหน้าหลักครับ';
          } else if (userText.includes('รถ') || userText.includes('grab')) {
            reply = 'คุณสามารถกดเมนู "เรียกรถ (GrabCar)" บนหน้าหลักเพื่อเปิดใช้งาน Grab Transport ได้ทันทีครับ';
          } else if (userText.includes('อาหาร')) {
            reply = 'คุณสามารถกดเมนู "สั่งอาหาร (GrabFood)" บนหน้าหลักเพื่อค้นหาร้านอร่อยส่งตรงถึงบ้านได้เลยครับ';
          } else if (userText.includes('ช้อป') || userText.includes('ซื้อ')) {
            reply = 'คุณสามารถกดเมนู "สั่งสินค้าออนไลน์ (Shopee)" เพื่อเลือกซื้อสินค้าโปรโมชันและผ่อน 0% บน Shopee ได้ทันทีครับ';
          }
          setAiMessages(prev => [...prev, { sender: 'ai', text: reply }]);
        }, 600);
      };

      // 9 Main Menu Items on Dashboard
      const menuCards = [
        { 
          id: 'ride', 
          title: 'เรียกรถรับ-ส่ง (GrabCar)', 
          desc: 'เปิดบริการ Grab Transport ทันที', 
          icon: 'car', 
          color: 'text-cyan-400', 
          border: 'hover:border-cyan-500', 
          bg: 'bg-cyan-500/10',
          onClick: () => window.open('https://www.grab.com/th/transport/', '_blank') 
        },
        { 
          id: 'food', 
          title: 'สั่งซื้ออาหาร (GrabFood)', 
          desc: 'สั่งอาหารร้านดังส่งถึงบ้านบน GrabFood', 
          icon: 'utensils-crossed', 
          color: 'text-orange-400', 
          border: 'hover:border-orange-500', 
          bg: 'bg-orange-500/10',
          onClick: () => window.open('https://www.grab.com/th/food/', '_blank') 
        },
        { 
          id: 'mall', 
          title: 'สั่งสินค้าออนไลน์ (Shopee)', 
          desc: 'ช้อปปิ้งสินค้าออนไลน์ครบครันบน Shopee', 
          icon: 'shopping-bag', 
          color: 'text-purple-400', 
          border: 'hover:border-purple-500', 
          bg: 'bg-purple-500/10',
          onClick: () => window.open('https://shopee.co.th/', '_blank') 
        },
        { 
          id: 'bill', 
          title: 'จ่ายค่าไฟ/น้ำ (MEA & PEA)', 
          desc: 'ชำระบิลค่าไฟ 1,820฿ ผ่าน QR PromptPay', 
          icon: 'credit-card', 
          color: 'text-emerald-400', 
          border: 'hover:border-emerald-500', 
          bg: 'bg-emerald-500/10',
          onClick: () => setShowBillModal(true) 
        },
        { 
          id: 'sos', 
          title: 'แจ้งเหตุด่วน SOS', 
          desc: 'ส่งสัญญาณฉุกเฉิน & โทร 191 / 1669', 
          icon: 'alert-triangle', 
          color: 'text-rose-500', 
          border: 'border-rose-500/40 bg-rose-950/20 hover:border-rose-500', 
          bg: 'bg-rose-500/10',
          onClick: () => setSosActive(true) 
        },
        { 
          id: 'home', 
          title: 'สั่งเปิด-ปิดบ้าน IoT', 
          desc: 'ควบคุมสวิตช์ไฟ แอร์ อุปกรณ์ในบ้าน', 
          icon: 'home', 
          color: 'text-pink-400', 
          border: 'hover:border-pink-500', 
          bg: 'bg-pink-500/10',
          onClick: () => {
            const el = document.getElementById('smarthome-section');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          } 
        },
        { 
          id: 'ai', 
          title: 'ผู้ช่วย AI ปรึกษา', 
          desc: 'ถาม-ตอบข้อสงสัยตลอด 24 ชม.', 
          icon: 'bot', 
          color: 'text-violet-400', 
          border: 'hover:border-violet-500', 
          bg: 'bg-violet-500/10',
          onClick: () => setShowAiModal(true) 
        },
        { 
          id: 'stocks', 
          title: 'ตลาดหุ้น SET', 
          desc: 'ดูราคาหุ้น กราฟ และสรุปตลาด SET', 
          icon: 'trending-up', 
          color: 'text-teal-400', 
          border: 'hover:border-teal-500', 
          bg: 'bg-teal-500/10',
          onClick: () => {
            const el = document.getElementById('stocks-section');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          } 
        },
        { 
          id: 'news', 
          title: 'ข่าวสารบ้านเมือง', 
          desc: 'อัปเดตข่าวเศรษฐกิจ การเมือง สังคม', 
          icon: 'newspaper', 
          color: 'text-blue-400', 
          border: 'hover:border-blue-500', 
          bg: 'bg-blue-500/10',
          onClick: () => {
            const el = document.getElementById('news-section');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          } 
        },
      ];

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Top Header Bar */}
          <header className="sticky top-0 z-40 w-full glass-panel border-b border-white/10 px-4 lg:px-8 py-3 mb-6">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* App Brand */}
              <div className="flex items-center gap-3">
                <img src="logo.jpg" alt="One Stop Service Logo" className="w-10 h-10 rounded-xl object-cover border border-emerald-400/40 shadow-lg" />
                <div>
                  <h1 className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-teal-200 to-emerald-400 bg-clip-text text-transparent">
                    One Stop Service <span className="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Super App 9-in-1</span>
                  </h1>
                  <p className="text-xs text-gray-400 flex items-center gap-1">
                    <i data-lucide="map-pin" className="w-3 h-3 text-emerald-400"></i> กรุงเทพมหานคร, ไทย
                  </p>
                </div>
              </div>

              {/* Header Right Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                
                {/* PWA Install Button */}
                <button 
                  onClick={handleInstallPWA}
                  className="px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xs flex items-center gap-1.5 shadow-md hover:scale-105 transition-transform"
                >
                  <i data-lucide="download" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">ติดตั้งแอป PWA</span>
                </button>

                {/* Notifications Bell */}
                <div className="relative">
                  <button 
                    onClick={() => setShowNotif(!showNotif)}
                    className="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 relative"
                  >
                    <i data-lucide="bell" className="w-5 h-5"></i>
                    {notifications.length > 0 && (
                      <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center">
                        {notifications.length}
                      </span>
                    )}
                  </button>

                  {showNotif && (
                    <div className="absolute right-0 mt-2 w-80 glass-panel p-4 rounded-2xl shadow-2xl z-50 border border-white/20">
                      <h4 className="font-bold text-xs text-white mb-2 pb-2 border-b border-white/10">การแจ้งเตือนล่าสุด</h4>
                      <div className="space-y-2">
                        {notifications.map(n => (
                          <div key={n.id} className="p-2.5 rounded-xl bg-white/5 text-xs">
                            <p className="font-bold text-white">{n.title}</p>
                            <p className="text-gray-300 text-[11px]">{n.detail}</p>
                            <span className="text-[10px] text-gray-400">{n.time}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* User Profile */}
                <div className="flex items-center gap-2 pl-2 border-l border-white/10">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center font-bold text-white shadow-md border border-white/20">
                    <i data-lucide="user" className="w-5 h-5"></i>
                  </div>
                  <span className="hidden sm:inline text-xs font-bold text-white">คุณนรเศรษฐ์</span>
                </div>

              </div>

            </div>
          </header>

          {/* Main Dashboard Single Page */}
          <main className="max-w-7xl mx-auto px-4 lg:px-8 w-full space-y-6">
            
            {/* Hero Welcome Banner */}
            <div className="glass-panel p-6 sm:p-8 rounded-3xl bg-gradient-to-r from-emerald-950/80 via-teal-950/60 to-slate-900 border-emerald-500/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
              <div>
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-semibold mb-2">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5"></i> ยินดีต้อนรับ คุณนรเศรษฐ์ (พร้อมใช้งานทุกอุปกรณ์)
                </span>
                <h2 className="text-2xl lg:text-3xl font-extrabold text-white">
                  ศูนย์รวมความสะดวกสบาย<span className="text-gradient-purple"> ประจำวันของคุณ (9-in-1)</span>
                </h2>
                <p className="text-xs text-gray-300 mt-1 max-w-xl">
                  จัดการทุกบริการได้ครบจบในหน้าเดียว ทั้งเรียกรถ สั่งอาหาร สั่งสินค้าออนไลน์ จ่ายบิลค่าไฟ แจ้งเหตุฉุกเฉิน ควบคุมบ้าน และปรึกษา AI
                </p>
              </div>

              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setShowAiModal(true)}
                  className="px-5 py-3 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-xs shadow-lg flex items-center gap-2 hover:scale-105 transition-transform shrink-0"
                >
                  <i data-lucide="bot" className="w-4 h-4"></i> ปรึกษาผู้ช่วย AI
                </button>
              </div>
            </div>

            {/* Breaking News & Stock Ticker Bar */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div 
                onClick={() => {
                  const el = document.getElementById('news-section');
                  if (el) el.scrollIntoView({ behavior: 'smooth' });
                }} 
                className="glass-panel p-3.5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-blue-500 transition"
              >
                <span className="px-2.5 py-1 rounded-lg bg-blue-500/20 text-blue-400 font-bold text-xs shrink-0">ข่าวด่วน</span>
                <p className="text-xs text-gray-200 truncate flex-1 px-3">แบงก์ชาติปรับประมาณการเศรษฐกิจไทยปี 2026 เติบโตแกร่งขึ้น</p>
                <i data-lucide="arrow-right" className="w-4 h-4 text-gray-400 shrink-0"></i>
              </div>

              <div 
                onClick={() => {
                  const el = document.getElementById('stocks-section');
                  if (el) el.scrollIntoView({ behavior: 'smooth' });
                }} 
                className="glass-panel p-3.5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-emerald-500 transition"
              >
                <span className="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold text-xs shrink-0">SET Index</span>
                <p className="text-xs text-white font-bold flex-1 px-3">1,385.42 <span className="text-emerald-400 font-medium pl-2">+12.30 (+0.90%)</span></p>
                <i data-lucide="arrow-right" className="w-4 h-4 text-gray-400 shrink-0"></i>
              </div>
            </div>

            {/* 9 Main Convenience Hub Cards Grid */}

    function AiView({ setActiveTab }) {
      const [chat, setChat] = useState([
        { id: 1, sender: 'ai', text: 'สวัสดีครับคุณนรเศรษฐ์ ผมคือ One Stop AI Advisor ยินดีให้คำปรึกษาปัญหาบ้าน อาหาร สุขภาพ การเงิน และเทคโนโลยี 24 ชั่วโมงครับ' }
      ]);
      const [text, setText] = useState('');

      const handleSend = () => {
        if (!text) return;
        const userMsg = { id: Date.now(), sender: 'user', text };
        setChat(prev => [...prev, userMsg]);
        setText('');
        setTimeout(() => {
          setChat(prev => [...prev, { id: Date.now()+1, sender: 'ai', text: `ยินดีให้คำแนะนำครับคุณนรเศรษฐ์ ในเรื่อง "${userMsg.text}" สามารถใช้บริการต่างๆ ผ่านแถบเมนูด้านบนได้เลยครับ` }]);
        }, 1000);
      };

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 rounded-3xl border-indigo-500/30">
            <h2 className="text-xl font-bold text-white flex items-center gap-2">
              <i data-lucide="bot" className="w-5 h-5 text-violet-400"></i> ผู้ช่วย AI ให้คำปรึกษาอัจฉริยะ (AI Advisor)

              <input type="text" value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} className="flex-1 bg-slate-800 border border-white/10 p-3 rounded-xl text-xs text-white" placeholder="พิมพ์คำถามของคุณ..." />
